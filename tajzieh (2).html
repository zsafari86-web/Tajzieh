<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>✂️ تجزیه معادله درجه دوم — شاد و تعاملی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #fff8f0;
  --bg-image: radial-gradient(circle at 0% 0%, #ffe0b5 0%, transparent 40%),
              radial-gradient(circle at 100% 100%, #ffd4a8 0%, transparent 40%),
              radial-gradient(circle at 50% 50%, #fff5e8 0%, #fff8f0 100%);
  --card-bg: rgba(255, 255, 255, 0.65);
  --border-color: rgba(255, 180, 80, 0.30);
  --text-color: #3d2a1a;
  --text2-color: #6a4a2a;
  --text3-color: #a08060;
  --accent-color: #ff7a2f;
  --accent2-color: #ff9a5a;
  --gold-color: #f5a623;
  --green-color: #2ecc71;
  --red-color: #e74c3c;
  --pink-color: #ff6b8a;
  --purple-color: #a855f7;
  --cyan-color: #06b6d4;
  --glow-shadow: 0 8px 40px rgba(255, 160, 80, 0.15);
  --card-shadow: 0 8px 32px rgba(255, 160, 80, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  --btn-shadow: 0 4px 20px rgba(255, 160, 80, 0.25);
  --btn-hover-shadow: 0 8px 32px rgba(255, 160, 80, 0.35);
}
body.dark-mode {
  --bg: #1a1208;
  --bg-image: radial-gradient(circle at 0% 0%, #3a2818 0%, transparent 40%),
              radial-gradient(circle at 100% 100%, #2a1a0e 0%, transparent 40%),
              radial-gradient(circle at 50% 50%, #1a1208 0%, #1a1208 100%);
  --card-bg: rgba(50, 35, 20, 0.70);
  --border-color: rgba(255, 180, 100, 0.20);
  --text-color: #f5e6d0;
  --text2-color: #d4b88a;
  --text3-color: #a08050;
  --accent-color: #ff9a5a;
  --accent2-color: #ff7a2f;
  --gold-color: #f5a623;
  --glow-shadow: 0 8px 32px rgba(255, 180, 100, 0.08);
  --card-shadow: 0 8px 32px rgba(255, 180, 100, 0.06), inset 0 1px 0 rgba(255, 180, 100, 0.05);
  --btn-shadow: 0 4px 16px rgba(255, 180, 100, 0.10);
  --btn-hover-shadow: 0 8px 24px rgba(255, 180, 100, 0.20);
}
body {
  font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text-color);
  padding: 12px;
  min-height: 100vh;
  background-image: var(--bg-image);
  background-attachment: fixed;
  transition: background 0.5s ease, color 0.5s ease;
}
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle at 20% 30%, rgba(255, 200, 100, 0.06) 0%, transparent 30%),
              radial-gradient(circle at 80% 70%, rgba(255, 100, 150, 0.04) 0%, transparent 30%),
              radial-gradient(circle at 50% 50%, rgba(100, 200, 255, 0.03) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
  animation: bgFloat 30s ease-in-out infinite alternate;
}
@keyframes bgFloat {
  0% { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(2%, -2%) rotate(2deg); }
}
#app { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }

.topbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 8px; padding: 10px 18px; background: var(--card-bg);
  border: 2px solid var(--border-color); border-radius: 20px; margin-bottom: 14px;
  backdrop-filter: blur(24px); box-shadow: var(--glow-shadow);
}
.topbar .logo {
  font-size: 22px; font-weight: 700;
  background: linear-gradient(135deg, #ff7a2f, #f5a623, #ff6b8a, #a855f7);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: rainbowText 6s ease-in-out infinite alternate;
}
@keyframes rainbowText {
  0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; }
}
.topbar .logo span { background: none; -webkit-text-fill-color: var(--text3-color); font-weight: 400; }
.btn-theme, .btn-reset {
  background: rgba(255, 255, 255, 0.3); border: 2px solid var(--border-color);
  color: var(--text2-color); padding: 6px 16px; border-radius: 14px;
  cursor: pointer; font-size: 16px; transition: 0.3s;
  backdrop-filter: blur(4px); font-family: inherit; font-weight: 600;
}
.btn-theme { min-width: 48px; min-height: 48px; display: flex; align-items: center; justify-content: center; }
.btn-theme:hover, .btn-reset:hover {
  background: rgba(255, 160, 80, 0.12); border-color: var(--accent-color); transform: scale(1.05);
}

#main-menu {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 75vh; gap: 24px; text-align: center; padding: 20px 10px;
}
#main-menu h1 {
  font-size: 2.4rem; font-weight: 700;
  background: linear-gradient(135deg, #ff7a2f, #f5a623, #ff6b8a, #a855f7, #06b6d4);
  background-size: 300% 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: rainbowText 8s ease-in-out infinite alternate; line-height: 1.4;
}
#main-menu p { color: var(--text2-color); max-width: 600px; line-height: 2; font-size: 1.05rem; }
.menu-buttons {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; max-width: 800px;
}
.menu-btn {
  background: rgba(255, 255, 255, 0.3); border: 2px solid var(--border-color);
  border-radius: 20px; padding: 22px 14px; font-size: 1rem; font-weight: 600;
  color: var(--text2-color); cursor: pointer; transition: 0.3s;
  font-family: inherit; backdrop-filter: blur(8px); box-shadow: var(--btn-shadow);
}
.menu-btn:hover {
  border-color: var(--accent-color); transform: scale(1.04) translateY(-3px); color: var(--text-color);
}
.menu-btn .icon { font-size: 2.2rem; display: block; margin-bottom: 6px; }

.main-layout { display: none; flex-direction: column; gap: 12px; width: 100%; }
.top-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 4px; }
#back-to-menu {
  background: rgba(255, 255, 255, 0.3); border: 2px solid var(--border-color);
  color: var(--text2-color); border-radius: 30px; padding: 6px 20px;
  font-size: 0.95rem; font-weight: 500; cursor: pointer; font-family: inherit; transition: 0.3s;
}
#back-to-menu:hover { background: rgba(255, 160, 80, 0.10); border-color: var(--accent-color); transform: scale(1.03); }

.content-card {
  background: var(--card-bg); border: 2px solid var(--border-color);
  border-radius: 20px; padding: 18px 20px; backdrop-filter: blur(24px);
  box-shadow: var(--card-shadow); transition: 0.3s; margin-bottom: 14px; width: 100%;
}
.content-card .title {
  font-size: 1.4rem; font-weight: 700;
  background: linear-gradient(135deg, var(--gold-color), var(--accent-color));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
}

.method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 14px 0; }
.method-card {
  background: rgba(255, 255, 255, 0.15); border: 2px solid var(--border-color);
  border-radius: 16px; padding: 16px; transition: 0.4s; position: relative; overflow: hidden;
}
.method-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent-color), var(--gold-color), var(--pink-color));
  opacity: 0; transition: 0.4s;
}
.method-card:hover::before { opacity: 1; }
.method-card:hover { border-color: var(--accent-color); transform: translateY(-3px); }
.method-card.active { border-color: var(--accent-color); background: rgba(255, 160, 80, 0.08); box-shadow: 0 0 40px rgba(255, 160, 80, 0.10); }
.method-card .method-title { font-weight: 700; color: var(--gold-color); font-size: 1.05rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.method-card .method-formula { font-family: 'Cambria Math', serif; font-size: 1.15rem; color: var(--text-color); direction: ltr; padding: 6px 0; text-align: center; }
.method-card .method-desc { font-size: 0.85rem; color: var(--text2-color); margin-top: 4px; line-height: 1.8; }
.method-card .method-example { font-size: 0.85rem; color: var(--text3-color); margin-top: 6px; padding: 6px 10px; background: rgba(255, 255, 255, 0.10); border-radius: 8px; direction: ltr; font-family: 'Cambria Math', serif; text-align: center; }

/* اصلاحات اساسی برای راست‌چین و چپ‌چین شدن منطقی */
.input-row {
  display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: center;
  margin: 10px 0; background: rgba(255, 255, 255, 0.25); padding: 12px 14px;
  border-radius: 14px; border: 2px solid var(--border-color); direction: rtl; /* کل ردیف راست به چپ است */
}
.input-group {
  display: inline-flex; align-items: center; gap: 6px; direction: ltr; /* اما داخل هر بلوک، حروف انگلیسی چپ به راست است */
}
.input-group label { font-size: 1.05rem; color: var(--text2-color); font-weight: 700; font-family: 'Cambria Math', serif; }
.input-group input[type="text"] {
  width: 70px; padding: 8px 6px; border-radius: 10px; border: 2px solid var(--border-color);
  background: #fff; color: var(--accent-color); font-size: 1.05rem;
  text-align: center; font-weight: bold; outline: none; transition: 0.2s; font-family: 'Cambria Math', Tahoma, sans-serif; 
  direction: ltr !important; unicode-bidi: bidi-override; 
}
.input-group input[type="text"]:focus { border-color: var(--accent-color); box-shadow: 0 0 20px rgba(255, 160, 80, 0.15); transform: scale(1.03); }
.input-group input[readonly], .input-group input:disabled { opacity: 0.8; background: #fdf5ef; border-color: #f7dcb7; color: #5a4030; }

.equation-display {
  text-align: center; font-family: 'Cambria Math', serif; font-size: 1.2rem;
  padding: 12px 16px; background: rgba(255, 255, 255, 0.15); border-radius: 12px;
  border: 2px solid var(--border-color); margin: 10px 0; direction: ltr; color: var(--text-color);
  min-height: 50px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px;
}
.equation-display .val { color: var(--accent-color); font-weight: 700; }
.equation-display .val-neg { color: var(--red-color); font-weight: 700; }
.equation-display .op { color: var(--text3-color); }
.equation-display .eq-sign { color: var(--gold-color); }
.equation-display .paren { color: var(--text3-color); }

/* کسر استاندارد برای حذف اسلش */
.frac { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 4px; font-family:'Cambria Math', serif; font-size:1em; }
.frac .num { border-bottom:2px solid currentColor; padding:0 4px; line-height:1.2; }
.frac .den { padding:0 4px; line-height:1.2; }

.btn {
  background: linear-gradient(135deg, var(--accent-color), var(--accent2-color));
  border: none; color: #fff; padding: 10px 22px; border-radius: 12px;
  font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.3s;
  font-family: inherit; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--btn-shadow);
}
.btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: var(--btn-hover-shadow); }
.btn:active { transform: scale(0.96); }
.btn-gold { background: rgba(245, 166, 35, 0.10); border: 2px solid var(--gold-color); color: var(--gold-color); }
.btn-gold:hover { background: rgba(245, 166, 35, 0.18); color: var(--text-color); }
.btn-green { background: rgba(46, 204, 113, 0.15); border: 2px solid var(--green-color); color: var(--green-color); }
.btn-green:hover { background: rgba(46, 204, 113, 0.25); color: var(--text-color); }
.btn-rainbow {
  background: linear-gradient(135deg, #ff7a2f, #f5a623, #ff6b8a, #a855f7);
  background-size: 300% 300%; animation: rainbowText 4s ease-in-out infinite alternate;
  border: none; color: #fff; box-shadow: 0 4px 24px rgba(255, 160, 80, 0.30);
}
.btn-big { padding: 12px 32px; font-size: 1.1rem; }

.step-box {
  background: rgba(255, 160, 80, 0.05); border: 2px solid rgba(255, 160, 80, 0.15);
  border-radius: 16px; padding: 16px 18px; margin: 10px 0; border-right: 4px solid var(--accent-color);
}
.step-box .step-title { font-weight: 700; color: var(--gold-color); font-size: 1.05rem; margin-bottom: 6px; }
.step-box .step-desc { color: var(--text2-color); font-size: 0.95rem; margin-bottom: 10px; line-height: 1.9; }
.step-box .step-options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.step-box .step-options button {
  padding: 8px 18px; border-radius: 12px; border: 2px solid var(--border-color);
  background: rgba(255, 255, 255, 0.15); color: var(--text2-color); cursor: pointer;
  font-family: inherit; font-size: 0.9rem; transition: 0.2s; font-weight: 600; direction: ltr;
}
.step-box .step-options button:hover { background: rgba(255, 160, 80, 0.15); border-color: var(--accent-color); transform: scale(1.04); }

.feedback { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; text-align: center; display: none; line-height: 1.9; direction: rtl; }
.feedback.show { display: block; }
.feedback.success { background: rgba(46, 204, 113, 0.08); border: 1px solid rgba(46, 204, 113, 0.20); color: var(--green-color); }
.feedback.error { background: rgba(231, 76, 60, 0.08); border: 1px solid rgba(231, 76, 60, 0.20); color: var(--red-color); }

.result-box {
  margin-top: 14px; padding: 16px 20px; border-radius: 14px;
  background: rgba(46, 204, 113, 0.06); border: 2px solid rgba(46, 204, 113, 0.25);
  text-align: center; font-size: 1rem; line-height: 2.4; direction: ltr;
  font-family: 'Cambria Math', serif; color: var(--text-color);
}
.result-box .hl-green { color: var(--green-color); font-weight: 700; }
.result-box .hl-gold { color: var(--gold-color); font-weight: 700; }

.hint-box {
  text-align: center; font-size: 0.9rem; color: var(--text2-color);
  padding: 8px 14px; background: rgba(255, 255, 255, 0.10);
  border-radius: 10px; margin: 8px 0; direction: rtl; line-height: 1.9;
}
.hint-box .hl { color: var(--gold-color); font-weight: 600; }
.hint-box.purple { background: rgba(168, 85, 247, 0.08); border: 2px solid var(--purple-color); }
.hint-box.purple .hl { color: var(--purple-color); }

#muteBtn {
  position: fixed; bottom: 20px; left: 20px; z-index: 10000;
  background: rgba(255, 255, 255, 0.3); color: var(--text-color);
  border: 2px solid var(--border-color); border-radius: 50%;
  width: 54px; height: 54px; font-size: 1.6rem; cursor: pointer;
  backdrop-filter: blur(8px); box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  transition: 0.3s; display: flex; align-items: center; justify-content: center;
}
#muteBtn:hover { background: rgba(255, 160, 80, 0.15); border-color: var(--accent-color); transform: scale(1.10) rotate(8deg); }

#credit-footer {
  margin-top: 25px; padding-top: 15px; text-align: center;
  font-size: 0.9rem; color: var(--text3-color); border-top: 2px solid var(--border-color); opacity: 0.7;
}
#credit-footer b { color: var(--gold-color); }

@media (max-width: 700px) {
  #main-menu h1 { font-size: 1.8rem; }
  .menu-buttons { grid-template-columns: repeat(2, 1fr); }
  .method-grid { grid-template-columns: 1fr; }
}
@media (max-width: 500px) {
  .content-card { padding: 14px; }
  .menu-btn { padding: 16px 10px; font-size: 0.95rem; }
  #muteBtn { width: 46px; height: 46px; font-size: 1.3rem; }
}
/* ===== افزوده‌ها: زبانه‌ها، پیشرفت، انیمیشن، کنتراست ===== */
.tabs { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
.tabs button { flex: 1; min-width: 120px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--border-color);
  background: rgba(255,255,255,.25); color: var(--text2-color); font: inherit; font-weight: 700; cursor: pointer; transition: .25s; }
.tabs button.on { background: linear-gradient(135deg, var(--accent-color), var(--gold-color)); color: #fff; border-color: transparent; transform: translateY(-2px); }
.tabs button.lock { opacity: .6; }
.pbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border-color); font-weight: 700; color: var(--text3-color); transition: .3s; }
.dot.now { border-color: var(--accent-color); color: var(--accent-color); transform: scale(1.12); }
.dot.ok { background: var(--green-color); border-color: var(--green-color); color: #fff; }
.chip { padding: 4px 12px; border-radius: 20px; background: rgba(255,160,80,.15); font-weight: 700; }
.pbar .dot + .chip { margin-inline-start: auto; }
.mascot { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.mascot .face { font-size: 2.2rem; animation: bob 2s ease-in-out infinite; }
.mascot .bub { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 16px; padding: 8px 14px; font-weight: 600; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.pop { animation: pop .35s ease; }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
.cf { position: fixed; z-index: 20000; font-size: 1.4rem; pointer-events: none; animation: cf 1.1s ease-out forwards; }
@keyframes cf { to { transform: translate(var(--dx), var(--dy)) rotate(300deg); opacity: 0; } }
.ex-line { display: flex; gap: 10px; align-items: center; padding: 10px 14px; margin: 6px 0; border-radius: 12px; background: rgba(255,255,255,.2); border-right: 4px solid var(--gold-color); line-height: 2; }
.ex-line .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-color); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.trophy { text-align: center; padding: 14px; }
.trophy .big { font-size: 4rem; animation: bob 1.6s infinite; }
.step-options button.good { border-color: var(--green-color); background: rgba(46,204,113,.2); }
.step-options button.bad { border-color: var(--red-color); opacity: .6; }
.input-group input:disabled { cursor: not-allowed; }
/* کنتراست بهتر متن‌های رنگی روی زمینه‌ی روشن */
.btn-gold, .hint-box .hl, .step-box .step-title, .method-card .method-title, .result-box .hl-gold { color: #a86400; }
.btn-green, .feedback.success, .result-box .hl-green { color: #17824a; }
body.dark-mode .btn-gold, body.dark-mode .hint-box .hl, body.dark-mode .step-box .step-title, body.dark-mode .method-card .method-title, body.dark-mode .result-box .hl-gold { color: var(--gold-color); }
body.dark-mode .btn-green, body.dark-mode .feedback.success, body.dark-mode .result-box .hl-green { color: #5fe39a; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .cf { display: none; } }

/* ===== فرمول بدون شکست خط، رادیکال کامل، جاخالی‌ها ===== */
.nb { white-space: nowrap; }
.rad { display: inline-flex; align-items: stretch; direction: ltr; white-space: nowrap; vertical-align: middle; }
.rad .rs { font-size: 1.25em; line-height: 1; align-self: flex-end; }
.rad .rv { border-top: 2px solid currentColor; padding: 0 3px; margin-top: 4px; line-height: 1.3; }
.tpl { display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: center; gap: 4px; direction: ltr; font-size: 1.15rem;
  font-family: 'Cambria Math', serif; margin: 12px 0; overflow-x: auto; padding: 4px 0; }
.tpl > span:not(.slot) { line-height: 46px; white-space: nowrap; }
.tpl .slot { display: flex; flex-direction: column; align-items: center; }
.tpl .input-group input[type="text"] { width: 56px; padding: 8px 2px; }
.tpl small { font-size: .72rem; color: var(--text3-color); font-family: 'Vazirmatn', Tahoma, sans-serif; margin-top: 3px; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="logo">✂️ تجزیه‌یاب <span>| شاد</span></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn-theme" id="themeToggle" title="تغییر تم">🌓</button>
      <button class="btn-reset" onclick="backToMenu()">📋 منو</button>
    </div>
  </div>

  <div id="main-menu">
    <h1>✂️ تجزیه معادله درجه دوم</h1>
    <p>
      چهار روش اصلی برای تجزیه و حل معادله درجه دوم را یاد بگیر:<br>
      <span style="color:var(--accent-color);font-weight:700;">✂️ فاکتورگیری</span> ·
      <span style="color:var(--gold-color);font-weight:700;">🔲 اتحاد مزدوج</span> ·
      <span style="color:var(--green-color);font-weight:700;">🔗 جمله مشترک</span> ·
      <span style="color:var(--purple-color);font-weight:700;">🔍 ریشه‌گیری</span>
    </p>
    <div class="menu-buttons">
      <button class="menu-btn" onclick="showSection('factor')"><span class="icon">✂️</span><span>فاکتورگیری</span></button>

function fmtNum(v) {
  if (v === 0) return '0';
  if (Number.isInteger(v)) return v.toString();
  return v.toFixed(2).replace(/\.?0+$/, '');
}

function bdi(str) {
  return `<bdi dir="ltr" style="unicode-bidi: isolate;">${str}</bdi>`;
}

function getFrac(num, den) {
  return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
}

function formatEquationHTML(a, b, c) {
  let parts = [];
  let hasNonZero = false;
  
  const fmtVal = (v) => v < 0 ? `<span class="val-neg">${bdi(fmtNum(Math.abs(v)))}</span>` : `<span class="val">${bdi(fmtNum(v))}</span>`;
  
  if (a !== 0) {
    let term = '';
    if (a === 1) term = 'x²';
    else if (a === -1) term = '−x²';
    else term = fmtVal(a) + 'x²';
    parts.push(term);
    hasNonZero = true;
  }
  
  if (b !== 0) {
    let term = '';
    const absB = Math.abs(b);
    if (absB === 1) term = 'x';
    else term = fmtVal(absB) + 'x';
    
    if (hasNonZero) term = '<span class="op">' + (b > 0 ? '+' : '−') + '</span> ' + term;
    else if (b < 0) term = '−' + term;
    
    parts.push(term);
    hasNonZero = true;
  }
  
  if (c !== 0) {
    let term = '';
    if (c > 0 && hasNonZero) term = '<span class="op">+</span> ' + fmtVal(c);
    else if (c < 0 && hasNonZero) term = '<span class="op">−</span> ' + fmtVal(Math.abs(c));
    else term = fmtVal(c);
    
    parts.push(term);
    hasNonZero = true;
  }
  
  if (!hasNonZero) return '0 = <span class="eq-sign">0</span>';
  return parts.join(' ') + ' = <span class="eq-sign">0</span>';
}

function parseNum(raw) {

    .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x6F0).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660)

  if (m) return (m[1] ? -1 : 1) * Math.sqrt(+m[2]);

const MET = {

    exs: [{ eq: 'x² − 9 = 0', note: 'ضریب x² در این معادله ۱ است و نوشته نمی‌شود.',

const PR = { factor: [[1, -4, 0], [1, 6, 0], [1, -9, 0], [2, 8, 0], [-3, 12, 0], [4, -20, 0]],

const CH = [[1, -6, 0], [-2, 0, 50], [1, 3, -10], [2, -10, 0], [-5, 0, 45], [1, -8, 15], [3, 0, -48], [-1, 7, 0]];

function methodStep(a, b, c) {

}

function stepsOf(m, a, b, c) {

}

  } else {
    const ls = s.t === 'num' ? ['x² ='] : ['x₁ =', 'x₂ ='];
    body = '<div class="input-row">' + ls.map(l => `<div class="input-group"><label>${l}</label><input type="text" autocomplete="off" placeholder="?"></div>`).join('') + '<button class="btn btn-green">✅ بررسی</button></div>';
  }
  d.innerHTML = `<div class="step-title">📌 مرحله ${P.i + 1}: ${s.title}</div><div class="step-desc">${s.q}</div>${body}<div class="feedback"></div><div class="hint-box purple" style="display:none">💡 ${s.hint}</div><div style="text-align:center;margin-top:8px"><button class="btn btn-gold btn-hint">💡 راهنمایی</button></div>`;
  P.box.appendChild(d);
  const fb = d.querySelector('.feedback'), hb = d.querySelector('.hint-box'), hbtn = d.querySelector('.btn-hint'); let wrong = 0;
  const showHint = auto => { if (hb.style.display === 'none') { if (!auto) P.hints++; hb.style.display = 'block'; hbtn.disabled = true; } };
  hbtn.onclick = () => { showHint(false); playSound('click'); };
  const warn = t => { fb.className = 'feedback show error'; fb.innerHTML = '⚠️ ' + t; playSound('wrong'); };
  const fail = msg => { P.mistakes++; wrong++; fb.className = 'feedback show error'; fb.innerHTML = '❌ ' + pick(SAD) + (msg ? '<br>' + msg : '');
    d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); playSound('wrong'); if (wrong >= 2) showHint(true); };
  const win = (extra, idx) => { fb.className = 'feedback show success'; fb.innerHTML = '✅ ' + pick(HAPPY) + (extra ? '<br>' + extra : '');
    d.querySelectorAll('input,button').forEach(x => x.disabled = true); playSound('correct'); boom(d);
    if (s.isMeth) { const mk = Object.keys(NM).find(k => NM[k] === P.ch[idx].o); P.steps = P.steps.concat(stepsOf(mk, P.a, P.b, P.c)); }
    P.i++; P.i < P.steps.length ? showStep(P) : finish(P); };
  if (s.t === 'choice') d.querySelectorAll('[data-i]').forEach(btn => btn.onclick = () => {
    if (P.ch[+btn.dataset.i].ok) { btn.classList.add('good'); win(s.ok, +btn.dataset.i); } else { btn.classList.add('bad'); btn.disabled = true; fail(''); } });
  else d.querySelector('.btn-green').onclick = () => {
    const v = [...d.querySelectorAll('input')].map(i => parseNum(i.value));
    if (v.some(isNaN)) return warn(`فقط عدد بنویس (مثل ${L('3')}، ${L('-2')} یا ${L('1/2')}).`);
    if (s.t === 'num') return Math.abs(v[0] - s.exp) < .001 ? win(s.ok) : fail('');
    if (s.t === 'fill') return v.every((x, i) => Math.abs(x - s.exp[i]) < 1e-9) ? win(s.ok) : fail('ضریب x و عدد داخل پرانتز را با علامتشان بنویس.');
    if (s.t === 'pq') {
      if (v.some(x => !Number.isInteger(x))) return warn('p و q باید عدد صحیح باشند.');
      const [p, q] = v;
      return p * q === P.c && p + q === P.b ? win(s.ok) : fail(`${L(`${f(p)} × ${f(q)} = ${f(p * q)}`)} (باید ${L(f(P.c))}) و ${L(`${f(p)} + ${f(q)} = ${f(p + q)}`)} (باید ${L(f(P.b))})`);
    }
    const e = [...s.exp].sort((x, y) => x - y), g = [...v].sort((x, y) => x - y), tol = e.every(Number.isInteger) ? 1e-9 : .05;
    e.every((x, i) => Math.abs(x - g[i]) <= tol) ? win('') : fail('');
  };
  const i0 = d.querySelector('input'); if (i0) i0.focus({ preventScroll: true });
  if (P.i > 0) d.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function finish(P) {
  const r = P.steps[P.steps.length - 1].exp.slice().sort((x, y) => x - y), d = document.createElement('div'); d.className = 'result-box pop';
  d.innerHTML = `🎉 معادله حل شد!<br><span class="hl-gold nb">${formatEquationHTML(P.a, P.b, P.c)}</span><br>→ <span class="hl-green nb">x₁ = ${bdi(f(R(r[0])))}</span> &nbsp; <span class="hl-green nb">x₂ = ${bdi(f(R(r[1])))}</span>`;
  P.box.appendChild(d); d.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (P.onDone) P.onDone(P.mistakes, P.hints);
}
function loadProblem(m, a, b, c, box, onDone) {
  const e = m === 'challenge' ? '' : bad(m, a, b, c);
  if (e) { box.innerHTML = `<div class="feedback show error">⚠️ ${e}</div>`; playSound('wrong'); return; }
  box.innerHTML = `<div class="equation-display pop"><span class="nb">${formatEquationHTML(a, b, c)}</span></div>`;
  showStep({ m, a, b, c, box, onDone, steps: m === 'challenge' ? [methodStep(a, b, c)] : stepsOf(m, a, b, c), i: 0, mistakes: 0, hints: 0 });
}

/* ---------- وضعیت و زبانه‌ها ---------- */
let DONE = {}; try { DONE = JSON.parse(localStorage.getItem('tz-done') || '{}'); } catch (e) {}
const S = {}; Object.keys(MET).forEach(m => S[m] = { tab: 'ex', ex: 0, i: 0, stars: [], streak: 0, done: !!DONE[m] });
function tabs(m) {
  const st = S[m], el = $('tabs-' + m); if (m === 'challenge') { el.innerHTML = ''; return; }
  el.innerHTML = [['ex', '📖 مثال'], ['pr', '🎯 تمرین ۶ سؤالی'], ['fr', (st.done ? '🧪 ' : '🔒 ') + 'معادله‌های خودم']]
    .map(([t, l]) => `<button class="${st.tab === t ? 'on' : ''} ${t === 'fr' && !st.done ? 'lock' : ''}" data-t="${t}">${l}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => setTab(m, b.dataset.t));
}
function setTab(m, t) {
  const st = S[m];
  if (t === 'fr' && !st.done) { playSound('wrong'); const h = document.createElement('div'); h.className = 'hint-box purple shake';
    h.textContent = '🔒 اول ۶ تمرین را کامل کن تا این بخش باز شود!'; $('pane-' + m).prepend(h); setTimeout(() => h.remove(), 2600); return; }
  st.tab = t; tabs(m); ({ ex: renderExample, pr: renderPractice, fr: renderFree })[t](m); playSound('click');
}
function renderExample(m, k = 0) {
  const M = MET[m], st = S[m], E = M.exs[k], pane = $('pane-' + m); st.ex = 0;
  pane.innerHTML = `<div class="method-grid"><div class="method-card active" style="grid-column:1/-1"><div class="method-title">📌 فرمول</div><div class="method-formula"><span class="nb">${M.formula}</span></div><div class="method-desc">${M.desc}</div></div></div>
  ${M.exs.length > 1 ? `<div class="tabs">${M.exs.map((_, i) => `<button data-k="${i}" class="${i === k ? 'on' : ''}">مثال ${i + 1}</button>`).join('')}</div>` : ''}
  <div class="hint-box">🎯 این مثال را قدم‌به‌قدم ببین:</div><div class="equation-display">${L(E.eq)}</div><div class="hint-box">ℹ️ ${E.note}</div><div id="exl-${m}"></div>
  <div style="text-align:center;margin:12px 0"><button class="btn btn-rainbow btn-big" id="exb-${m}">▶️ شروع مثال</button></div>`;
  pane.querySelectorAll('[data-k]').forEach(b => b.onclick = () => renderExample(m, +b.dataset.k));
  $('exb-' + m).onclick = function () {
    if (st.ex < E.ex.length) {
      const d = document.createElement('div'); d.className = 'ex-line pop'; d.innerHTML = `<span class="n">${st.ex + 1}</span><span>${E.ex[st.ex]}</span>`;
      $('exl-' + m).appendChild(d); st.ex++; playSound('click'); this.textContent = st.ex < E.ex.length ? '➡️ مرحله بعد' : '🎯 برو سراغ تمرین';
    } else setTab(m, 'pr');
  };
}
const BUB = ['بزن بریم سراغ اولین سؤال! 🚀', 'عالی پیش می‌ری، ادامه بده 💪', 'نصف راه رو رفتی! 🔥', 'ادامه بده، داری می‌درخشی ✨', 'یکی مونده تا آخر! 💥', 'آخرین سؤال؛ تمومش کن! 🏁'];
function head(m) {
  const st = S[m], h = $('head-' + m); if (!h) return; const N = PR[m].length;
  h.innerHTML = Array.from({ length: N }, (_, i) => `<span class="dot ${i < st.i ? 'ok' : i === st.i ? 'now' : ''}">${i < st.i ? '✓' : i + 1}</span>`).join('') +
    `<span class="chip">⭐ ${st.stars.reduce((a, b) => a + b, 0)}</span><span class="chip">🔥 ${st.streak}</span>`;
}
function renderPractice(m) {
  const st = S[m], N = PR[m].length; if (st.i >= N) return trophy(m);
  $('pane-' + m).innerHTML = `<div class="pbar" id="head-${m}"></div><div class="mascot"><span class="face">🦉</span><span class="bub">${BUB[st.i]}</span></div><div id="prob-${m}"></div><div id="nxt-${m}" style="text-align:center;margin-top:12px"></div>`;
  head(m);
  const [a, b, c] = PR[m][st.i];
  loadProblem(m, a, b, c, $('prob-' + m), (mist, hn) => {
    st.stars[st.i] = Math.max(1, 3 - mist - hn); st.streak = mist ? 0 : st.streak + 1; st.i++; head(m);
    const nx = $('nxt-' + m); if (!nx) return;
    const n = document.createElement('button'); n.className = 'btn btn-rainbow btn-big'; n.textContent = st.i >= N ? '🏆 دیدن نتیجه' : '➡️ سؤال بعدی';
    n.onclick = () => { playSound('click'); renderPractice(m); }; nx.appendChild(n);
  });
}
function trophy(m) {
  const st = S[m], ch = m === 'challenge', mx = 3 * PR[m].length, t = st.stars.reduce((a, b) => a + b, 0);
  if (!ch) { st.done = true; DONE[m] = 1; try { localStorage.setItem('tz-done', JSON.stringify(DONE)); } catch (e) {} tabs(m); }
  const lv = t >= mx * .9 ? 0 : t >= mx * .65 ? 1 : 2;
  $('pane-' + m).innerHTML = `<div class="trophy pop"><div class="big">${['🏆', '🥇', '🌱'][lv]}</div><h2>${['نابغه‌ی تجزیه!', 'آفرین، عالی بود!', 'خوب بود، ادامه بده!'][lv]}</h2>
  <p style="margin:8px 0">⭐ ${t} از ${mx} ستاره</p>${ch ? '' : '<div class="hint-box purple">🔓 بخش «معادله‌های خودم» برایت باز شد!</div>'}
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px"><button class="btn btn-gold" id="again-${m}">🔁 دوباره</button>${ch ? '' : `<button class="btn btn-rainbow" id="free-${m}">🧪 معادله‌های خودم</button>`}</div></div>`;
  $('again-' + m).onclick = () => { Object.assign(st, { i: 0, stars: [], streak: 0 }); if (ch) PR.challenge = shuf(CH).slice(0, 6); renderPractice(m); };
  if (!ch) $('free-' + m).onclick = () => setTab(m, 'fr');
  const big = $('pane-' + m).querySelector('.big'); boom(big); setTimeout(() => boom(big), 350); playSound('correct');
}
function renderFree(m) {
  const D = { factor: [3, -12, 0], conj: [2, 0, -50], common: [1, -1, -12], sqrt: [5, 0, -45] }[m];
  const box = (id, v, ro) => `<div class="input-group"><label>${id} =</label><input type="text" id="fr-${m}-${id}" value="${v}" ${ro ? 'readonly' : ''} autocomplete="off"></div>`;
  $('pane-' + m).innerHTML = `<div class="hint-box">🧪 عددهای خودت را در کادرها بنویس و معادله‌ی جدید را حل کن! (کسر مثل ${L('1/2')} هم قبول است)</div>
  <div class="free-box"><div class="input-row">${box('c', D[2], m === 'factor')}${box('b', D[1], m === 'conj' || m === 'sqrt')}${box('a', D[0], m === 'common')}
  <button class="btn btn-gold" id="dice-${m}">🎲 تصادفی</button><button class="btn btn-rainbow btn-go" id="go-${m}">🚀 حل کن</button></div></div><div id="fprob-${m}"></div>`;
  const val = k => parseNum($(`fr-${m}-${k}`).value);
  const go = () => loadProblem(m, val('a'), val('b'), val('c'), $('fprob-' + m), () => boom($('fprob-' + m)));
  $('go-' + m).onclick = () => { playSound('click'); go(); };
  $('dice-' + m).onclick = () => { const [a, b, c] = RND[m](); $(`fr-${m}-a`).value = a; $(`fr-${m}-b`).value = b; $(`fr-${m}-c`).value = c; go(); };
}

function buildSections() {
  $('sections').innerHTML = Object.keys(MET).map(m => { const M = MET[m];
    return `<div id="section-${m}" class="section" style="display:none"><div class="content-card"><div class="title">${M.icon} ${M.title}</div><div class="hint-box ${m === 'sqrt' ? 'purple' : ''}">💡 ${M.hint}</div><div class="tabs" id="tabs-${m}"></div><div id="pane-${m}"></div></div></div>`; }).join('');
}
function showSection(m) {
  $('main-menu').style.display = 'none'; $('main-content').style.display = 'flex';
  document.querySelectorAll('.section').forEach(e => e.style.display = 'none'); $('section-' + m).style.display = 'block';
  $('section-title').textContent = MET[m].icon + ' ' + MET[m].name;
  Object.assign(S[m], { tab: 'ex', i: 0, stars: [], streak: 0 }); tabs(m);
  if (m === 'challenge') { PR.challenge = shuf(CH).slice(0, 6); renderPractice(m); } else renderExample(m);
  playSound('click'); window.scrollTo(0, 0);
}
function backToMenu() {
  $('main-menu').style.display = 'flex'; $('main-content').style.display = 'none';
  document.querySelectorAll('.section').forEach(el => el.style.display = 'none'); playSound('click');
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input[type=text]')) return;
  const b = e.target.closest('.step-box,.free-box'); const btn = b && b.querySelector('.btn-green,.btn-go'); if (btn && !btn.disabled) btn.click();
});
PR.challenge = shuf(CH).slice(0, 6);
buildSections();

/* ================================================================
   ماژول صوتی
================================================================ */
(function() {
  "use strict";
  const AudioFX = (function() {
    let ctx = null, muted = false;
    function ensureCtx() {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(freq, dur, opts) {
      if (muted) return;
      opts = opts || {};
      const c = ensureCtx();
      const t0 = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = opts.type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      const peak = opts.gain !== undefined ? opts.gain : 0.15;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.015, dur/3));
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }
    function click() { tone(680, 0.07, {gain:0.10}); setTimeout(()=>tone(880,0.05,{gain:0.08}),50); }
    function correct() { const notes = [523.25, 659.25, 783.99, 1046.5]; notes.forEach((f,i)=>setTimeout(()=>tone(f,0.15,{gain:0.12}),i*80)); }
    function wrong() {
      if (muted) return;
      const c = ensureCtx();
      const dur = 0.25;
      const bufferSize = c.sampleRate * dur;
      const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++) { const env = 1 - i/bufferSize; data[i] = (Math.random()*2-1) * env * 0.25; }
      const src = c.createBufferSource();
      src.buffer = buffer;
      const gain = c.createGain();
      gain.gain.setValueAtTime(0.15, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      src.connect(gain).connect(c.destination);
      src.start();
    }
    function toggleMute(v) { muted = v; }
    function isMuted() { return muted; }
    return { click, correct, wrong, toggleMute, isMuted };
  })();
  const muteBtn = document.getElementById('muteBtn');
  try { if (localStorage.getItem('tz-mute') === '1') { AudioFX.toggleMute(true); muteBtn.textContent = '🔇'; } } catch(e){}
  muteBtn.addEventListener('click', function() {
    const newMuted = !AudioFX.isMuted();
    AudioFX.toggleMute(newMuted);
    muteBtn.textContent = newMuted ? '🔇' : '🔊';
    try { localStorage.setItem('tz-mute', newMuted ? '1' : '0'); } catch(e){}
  });
  function resumeAudio() { try { AudioFX.click(); } catch(e){} document.removeEventListener('pointerdown', resumeAudio); }
  document.addEventListener('pointerdown', resumeAudio, { once: true });
  window.playSound = function(type) {
    if (type === 'correct') AudioFX.correct();
    else if (type === 'wrong') AudioFX.wrong();
    else AudioFX.click();
  };
})();

/* ================================================================
   مقداردهی اولیه
================================================================ */
window.onload = function() {
  loadTheme();
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.getElementById('main-menu').style.display = 'flex';
  document.getElementById('main-content').style.display = 'none';
};
</script>
</body>
